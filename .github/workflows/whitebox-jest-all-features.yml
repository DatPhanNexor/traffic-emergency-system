name: Jest White-box Coverage Feature 1-16

on:
  push:
    branches:
      - main
      - feature/SVP-3-kiem-thu-module-cuu-ho-sos
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  jest-whitebox-feature-01-16:
    name: Jest White-box Feature 1-16
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: suco/suco

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: suco/suco/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest white-box coverage Feature 1-16
        run: npm run coverage:whitebox

      - name: Upload Jest white-box coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-whitebox-feature-01-16-coverage
          path: suco/suco/coverage/whitebox-feature-01-16
